[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: every unknown path serves the app shell (client-side routing).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite emits content-hashed files under /assets, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
